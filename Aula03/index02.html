<body>

    <h1>Padding no CSS</h1>
    
    <h3>Definindo padding individuais</h3>

    <p class="ex1">Parágrafos com padding individuais</p>

    <hr>

    <h3>Utilizando a propriedade de padding</h3>

    <p class="padding-abbr1">Padding com um valor </p>
    <p class="padding-abbr2">Padding com dois valores</p>
    <p class="padding-abbr3">Padding com três valores</p>
    <p class="padding-abbr4">Pading com quatro valores </p>

    <hr>

    <h3>Pedding com width</h3>

    <div class="padding-width1">
        <p>Isso é um paragrafo</p>
    </div>

    <div class="padding-width2">
        <p>Isso é um paragrafo</p>
    </div>
